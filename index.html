<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="tow-images/favicon-logo.png">
  <link rel="apple-touch-icon" href="tow-images/apple-touch-icon.png">
  <title>Loading... | Tower of Wit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-loading">
  <img
    src="tow-images/backgrounds/city.png"
    alt="Background"
    class="bg-layer"
  />

  <img
    src="tow-images/logo-bgr.png"
    alt="Title"
    class="title-logo" 
   width: 14.4rem;
  max-width: 100%;                 
  height: auto;
  >

  <div class="loading-bar-box" id="loadingBarBox">
    
    <div class="bar-empty-layer"></div>

    <div class="fill-layer" id="fillLayer">
      <img
        src="tow-images/loading-bar-fill.png"
        alt="Loading Full"
        class="fill-image"
      />
    </div>

    <span class="start-text" id="startText">Click anywhere to start</span>
  </div>

  <script src="tow-script/loading.js"></script>
  <script src="tow-script/music.js"></script>
</body>
</html>
